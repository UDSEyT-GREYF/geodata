<section id="summaryPage" class="summary-page">
  <div class="summary-inner">
    <header class="summary-header">
      <div class="summary-kicker">Informe de Impacto Socioeconómico y Territorial</div>
      <div class="summary-airport-line" id="summaryAirportLine">Aeropuerto XXXXXXXX. Argentina</div>
      <h2 class="summary-title">RESUMEN EJECUTIVO</h2>
    </header>

    <section class="summary-content">
      <div class="summary-text" id="summaryText">
        <p>Cargando resumen ejecutivo…</p>
      </div>
    </section>

    <section id="summaryPerfilOperativoCard" class="summary-profile-card" hidden>
      <div class="summary-profile-head">
        <span id="summaryPerfilOperativoBadge" class="summary-profile-badge"></span>
        <h3 id="summaryPerfilOperativoTitle" class="summary-profile-title"></h3>
      </div>

      <p id="summaryPerfilOperativoText" class="summary-profile-text"></p>

      <div id="summaryPerfilOperativoMetrics" class="summary-profile-metrics"></div>
    </section>

    <section class="summary-figures">
      <figure class="summary-figure summary-figure-main">
        <img id="summaryImgAirport" alt="Síntesis del aeropuerto" loading="eager" decoding="async">
      </figure>
    </section>
  </div>
</section>
