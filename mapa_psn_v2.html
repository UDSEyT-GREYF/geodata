<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posiciones en plataforma</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#1f2937}
    .page{display:flex;flex-direction:column;height:100vh}
    .head{padding:12px 16px;border-bottom:1px solid #d8e0eb;background:#fff}
    .title{font-weight:700;color:#002855;font-size:1.05rem}
    .sub{margin-top:2px;font-size:.82rem;color:#5b6472}
    #map{flex:1;min-height:320px}
    .msg{padding:12px 16px;font-size:.88rem;color:#5b6472;background:#fff;border-top:1px solid #d8e0eb}
    .psn-tooltip{background:rgba(255,255,255,.92);border:1px solid #333;border-radius:2px;padding:2px 3px;font-size:.62rem;color:#111}
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <div class="title" id="title">Posiciones en plataforma</div>
      <div class="sub" id="sub">Cargando…</div>
    </div>
    <div id="map"></div>
    <div class="msg">Vista ampliada de posiciones en plataforma y pistas.</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/esri-leaflet@3/dist/esri-leaflet.js" crossorigin=""></script>
  <script>
    const params = new URLSearchParams(location.search);
    const iata = String(params.get('airport') || '').trim().toUpperCase();
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('sub');
    const map = L.map('map').setView([-34.6,-58.4], 5);
    L.esri.basemapLayer('Imagery').addTo(map);

    function getName(props){ return props?.['Aeropuerto'] || props?.['Nombre del Aeropuerto'] || iata || 'Aeropuerto'; }
    function getPoint(feature){
      const g = feature && feature.geometry;
      if (!g) return null;
      if (g.type === 'Point' && Array.isArray(g.coordinates)) return [g.coordinates[1], g.coordinates[0]];
      return null;
    }

    Promise.all([
      fetch('fuentes/Datos_aeropuertos.geojson').then(r => r.json()),
      fetch('fuentes/psn_posiciones.geojson').then(r => r.json()).catch(() => ({features:[]})),
      fetch('fuentes/pistas.geojson').then(r => r.json()).catch(() => ({features:[]}))
    ]).then(([data, psn, pistas]) => {
      const airportFeature = (data.features || []).find(f => String(f.properties?.IATA || '').toUpperCase() === iata);
      const props = airportFeature?.properties || {};
      titleEl.textContent = `Posiciones en plataforma – ${getName(props)} (${iata})`;
      subEl.textContent = 'PSN y pistas aeroportuarias';

      const psnFeats = (psn.features || []).filter(f => {
        const p = f.properties || {};
        const code = p.IATA || p.iata || p.iata_code;
        return String(code || '').toUpperCase() === iata;
      });
      const pistasFeats = (pistas.features || []).filter(f => {
        const p = f.properties || {};
        const code = p.IATA || p.iata || p.iata_code;
        return String(code || '').toUpperCase() === iata;
      });

      let bounds = null;
      if (psnFeats.length) {
        const layer = L.geoJSON(psnFeats, {
          pointToLayer: (feature, latlng) => {
            const marker = L.circleMarker(latlng, {radius:5,color:'#000',weight:1,fillColor:'#ff0000',fillOpacity:.9});
            const posLabel = feature.properties?.posicion || '';
            if (posLabel) marker.bindTooltip(posLabel, {permanent:true,direction:'top',offset:[0,-4],className:'psn-tooltip'});
            return marker;
          }
        }).addTo(map);
        const b = layer.getBounds();
        if (b.isValid()) bounds = b;
      }
      if (pistasFeats.length) {
        const layer = L.geoJSON(pistasFeats, {
          style:{color:'#222',weight:1,fillColor:'#ffff00',fillOpacity:0.15},
          onEachFeature:(feature, layer) => {
            const label = feature.properties?.etiqueta || feature.properties?.ETIQUETA || '';
            if (label) layer.bindTooltip(label, {permanent:true,direction:'center',className:'psn-tooltip'});
          }
        }).addTo(map);
        const b = layer.getBounds();
        if (b.isValid()) bounds = bounds ? bounds.extend(b) : b;
      }

      if (bounds && bounds.isValid()) {
        map.fitBounds(bounds, {padding:[20,20]});
      } else {
        const pt = getPoint(airportFeature);
        if (pt) {
          map.setView(pt, 15);
          L.marker(pt).addTo(map);
        } else {
          subEl.textContent = 'No se encontraron geometrías para este aeropuerto.';
        }
      }
      setTimeout(() => map.invalidateSize(), 50);
    }).catch(err => {
      console.error(err);
      subEl.textContent = 'No se pudo cargar la información del mapa.';
    });
  </script>
</body>
</html>
