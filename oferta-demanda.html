<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta y demanda de transporte aéreo</title>

  <link rel="stylesheet" href="css/oferta-demanda.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      background: #eef2f7;
      font-family: Roboto, Arial, sans-serif;
    }

    .test-toolbar {
      max-width: 210mm;
      margin: 14px auto 8px;
      padding: 8px 10px;
      box-sizing: border-box;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #d8e1ea;
      border-radius: 10px;
    }

    .test-toolbar label {
      font-size: 12px;
      color: #4f5d6b;
      font-weight: 600;
    }

    .test-toolbar select {
      min-width: 260px;
      padding: 6px 10px;
      border: 1px solid #cbd6e2;
      border-radius: 6px;
      font-size: 13px;
      color: #334150;
      background: #fff;
    }

    @media print {
      .test-toolbar {
        display: none !important;
      }

      body {
        background: #ffffff;
      }
    }
  </style>
</head>
<body>

  <div class="test-toolbar">
    <label for="airportSelect">Seleccionar aeropuerto</label>
    <select id="airportSelect">
      <option value="">Cargando aeropuertos...</option>
    </select>
  </div>

  <div id="partialHost"></div>

<script>
(async function () {
  try {
    const host = document.getElementById("partialHost");
    if (!host) {
      console.error("No existe #partialHost en oferta-demanda.html");
      return;
    }

    const partialResp = await fetch("partials/oferta-demanda.html?v=20260429-1", {
      cache: "no-store"
    });

    if (!partialResp.ok) {
      throw new Error("No se pudo cargar partials/oferta-demanda.html");
    }

    host.innerHTML = await partialResp.text();

    const s = document.createElement("script");
    s.src = "js/oferta-demanda.js?v=20260429-2";
    s.defer = true;

    s.onload = function () {
      document.dispatchEvent(new CustomEvent("report:partials-ready"));
    };

    s.onerror = function () {
      console.error("No se pudo cargar js/oferta-demanda.js");
    };

    document.body.appendChild(s);
  } catch (err) {
    console.error("No se pudo inicializar oferta-demanda.html", err);
  }
})();
</script>
</body>
</html>
