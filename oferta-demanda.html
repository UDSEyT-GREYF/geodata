<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta y demanda de transporte aéreo</title>

  <link rel="stylesheet" href="css/oferta-demanda.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      background: #eef2f7;
      font-family: Roboto, Arial, sans-serif;
    }

    .test-toolbar {
      max-width: 210mm;
      margin: 14px auto 8px;
      padding: 8px 10px;
      box-sizing: border-box;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #d8e1ea;
      border-radius: 10px;
    }

    .test-toolbar label {
      font-size: 12px;
      color: #4f5d6b;
      font-weight: 600;
    }

    .test-toolbar select {
      min-width: 260px;
      padding: 6px 10px;
      border: 1px solid #cbd6e2;
      border-radius: 6px;
      font-size: 13px;
      color: #334150;
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="test-toolbar">
    <label for="airportSelect">Seleccionar aeropuerto</label>
    <select id="airportSelect">
      <option value="">Cargando aeropuertos...</option>
    </select>
  </div>

  <div id="partialHost"></div>

  <script>
    fetch("partials/oferta-demanda.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("partialHost").innerHTML = html;

        const s = document.createElement("script");
        s.src = "js/oferta-demanda.js";
        document.body.appendChild(s);
      })
      .catch(err => console.error("No se pudo cargar el partial de oferta-demanda", err));
  </script>
</body>
</html>
