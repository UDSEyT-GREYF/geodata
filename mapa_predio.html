<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa del predio</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#1f2937}
    .page{display:flex;flex-direction:column;height:100vh}
    .head{padding:12px 16px;border-bottom:1px solid #d8e0eb;background:#fff}
    .title{font-weight:700;color:#002855;font-size:1.05rem}
    .sub{margin-top:2px;font-size:.82rem;color:#5b6472}
    #map{flex:1;min-height:320px}
    .msg{padding:12px 16px;font-size:.88rem;color:#5b6472;background:#fff;border-top:1px solid #d8e0eb}
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <div class="title" id="title">Mapa del predio</div>
      <div class="sub" id="sub">Cargando…</div>
    </div>
    <div id="map"></div>
    <div class="msg">Vista ampliada del predio aeroportuario.</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const params = new URLSearchParams(location.search);
    const iata = String(params.get('airport') || '').trim().toUpperCase();
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('sub');
    const map = L.map('map').setView([-34.6,-58.4], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

    function getName(props){ return props?.['Aeropuerto'] || props?.['Nombre del Aeropuerto'] || iata || 'Aeropuerto'; }
    function getPoint(feature){
      const g = feature && feature.geometry;
      if (!g) return null;
      if (g.type === 'Point' && Array.isArray(g.coordinates)) return [g.coordinates[1], g.coordinates[0]];
      return null;
    }

    Promise.all([
      fetch('fuentes/Datos_aeropuertos.geojson').then(r => r.json()),
      fetch('fuentes/poligonos_aeropuertos.geojson').then(r => r.json()).catch(() => ({features:[]}))
    ]).then(([data, polys]) => {
      const airportFeature = (data.features || []).find(f => String(f.properties?.IATA || '').toUpperCase() === iata);
      const props = airportFeature?.properties || {};
      titleEl.textContent = `Mapa del predio – ${getName(props)} (${iata})`;
      subEl.textContent = props?.['Provincia'] ? `${props['Localidad'] || ''}${props['Localidad'] ? ' · ' : ''}${props['Provincia']}` : 'Vista ampliada';

      const feats = (polys.features || []).filter(f => {
        const p = f.properties || {};
        const code = p.IATA || p.iata || p.iata_code;
        return String(code || '').toUpperCase() === iata;
      });

      if (feats.length) {
        const layer = L.geoJSON(feats, {
          style:{color:'#0072bb', weight:2, fillColor:'#4fa3ff', fillOpacity:0.35}
        }).addTo(map);
        const bounds = layer.getBounds();
        if (bounds.isValid()) map.fitBounds(bounds, {padding:[20,20]});
      } else {
        const pt = getPoint(airportFeature);
        if (pt) {
          L.marker(pt).addTo(map);
          map.setView(pt, 13);
        } else {
          subEl.textContent = 'No se encontraron geometrías para este aeropuerto.';
        }
      }
      setTimeout(() => map.invalidateSize(), 50);
    }).catch(err => {
      console.error(err);
      subEl.textContent = 'No se pudo cargar la información del mapa.';
    });
  </script>
</body>
</html>
