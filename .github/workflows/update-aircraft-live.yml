name: Actualizar aviones en vuelo

on:
  schedule:
    # cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar aviones en vuelo
        run: |
          mkdir -p data/aircraft

          python3 - <<'EOF'
          import json
          import urllib.parse
          import urllib.request
          import datetime
          import gzip
          import time
          import re
          from pathlib import Path

          output_path = Path("data/aircraft/latest.geojson")

          # Bounding box aproximado Argentina + entorno regional.
          BBOX = {
              "lat_min": -56.5,
              "lon_min": -76.5,
              "lat_max": -20.0,
              "lon_max": -50.0,
          }

          # Radio máximo documentado por Airplanes.live: 250 nm.
          # ADSB.lol usa el mismo esquema de endpoint por punto/radio.
          RADIUS_NM = 250

          # Puntos de consulta para cubrir Argentina y entorno regional.
          QUERY_POINTS = [
              {"id": "BuenosAires", "lat": -34.6037, "lon": -58.3816},
              {"id": "MarDelPlata", "lat": -38.0055, "lon": -57.5426},
              {"id": "BahiaBlanca", "lat": -38.7196, "lon": -62.2724},
              {"id": "Cordoba", "lat": -31.4201, "lon": -64.1888},
              {"id": "Mendoza", "lat": -32.8895, "lon": -68.8458},
              {"id": "Neuquen", "lat": -38.9516, "lon": -68.0591},
              {"id": "Bariloche", "lat": -41.1335, "lon": -71.3103},
              {"id": "ComodoroRivadavia", "lat": -45.8656, "lon": -67.4822},
              {"id": "RioGallegos", "lat": -51.6230, "lon": -69.2168},
              {"id": "Ushuaia", "lat": -54.8019, "lon": -68.3030},
              {"id": "Tucuman", "lat": -26.8083, "lon": -65.2176},
              {"id": "Salta", "lat": -24.7821, "lon": -65.4232},
              {"id": "Iguazu", "lat": -25.5972, "lon": -54.5786},
              {"id": "Resistencia", "lat": -27.4514, "lon": -58.9867},
          ]

          SOURCES = [
              {
                  "id": "adsb_lol",
                  "label": "ADSB.lol /v2/point",
                  "url_template": "https://api.adsb.lol/v2/point/{lat}/{lon}/{radius}",
                  "pause_seconds": 0.35,
              },
              {
                  "id": "airplanes_live",
                  "label": "Airplanes.live /v2/point",
                  "url_template": "https://api.airplanes.live/v2/point/{lat}/{lon}/{radius}",
                  "pause_seconds": 1.15,
              },
          ]

          OPENSKY_BBOX = {
              "lamin": BBOX["lat_min"],
              "lomin": BBOX["lon_min"],
              "lamax": BBOX["lat_max"],
              "lomax": BBOX["lon_max"],
          }

          OPENSKY_URL = (
              "https://opensky-network.org/api/states/all?"
              + urllib.parse.urlencode(OPENSKY_BBOX)
          )

          def utc_now():
              return datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"

          def clean_text(value):
              return str(value or "").strip()

          def first_present(data, keys):
              for key in keys:
                  value = data.get(key)
                  if value is not None and value != "":
                      return value
              return None

          def clean_iata(value):
              text = clean_text(value).upper()
              if len(text) == 3 and text.isalnum():
                  return text
              return ""

          def in_bbox(lat, lon):
              try:
                  lat = float(lat)
                  lon = float(lon)
              except Exception:
                  return False

              return (
                  BBOX["lat_min"] <= lat <= BBOX["lat_max"] and
                  BBOX["lon_min"] <= lon <= BBOX["lon_max"]
              )

          def meters_to_feet(value):
              if value is None:
                  return None
              try:
                  return round(float(value) * 3.28084)
              except Exception:
                  return None

          def feet_to_meters(value):
              if value is None:
                  return None

              if isinstance(value, str) and value.lower() == "ground":
                  return 0

              try:
                  return round(float(value) * 0.3048, 1)
              except Exception:
                  return None

          def ms_to_kmh(value):
              if value is None:
                  return None
              try:
                  return round(float(value) * 3.6, 1)
              except Exception:
                  return None

          def knots_to_kmh(value):
              if value is None:
                  return None
              try:
                  return round(float(value) * 1.852, 1)
              except Exception:
                  return None

          def build_route_label(origin, destination):
              if origin and destination:
                  return f"{origin} → {destination}"
              if origin:
                  return f"{origin} → s/d"
              if destination:
                  return f"s/d → {destination}"
              return None

          def route_from_text(value):
              text = clean_text(value).upper()
              if not text:
                  return "", ""

              # Busca patrones simples tipo AEP-EZE, AEP → COR, AEP/COR.
              codes = re.findall(r"\b[A-Z0-9]{3}\b", text)

              if len(codes) >= 2:
                  return clean_iata(codes[0]), clean_iata(codes[-1])

              return "", ""

          def extract_route(ac):
              # 1. Campos explícitos posibles.
              pairs = [
                  ("route_origin", "route_dest"),
                  ("origin_iata", "destination_iata"),
                  ("from_iata", "to_iata"),
                  ("airport_origin_code_iata", "airport_destination_code_iata"),
                  ("orig_iata", "dest_iata"),
              ]

              for origin_key, dest_key in pairs:
                  origin = clean_iata(ac.get(origin_key))
                  destination = clean_iata(ac.get(dest_key))

                  if origin or destination:
                      return origin, destination

              # 2. Objeto route si existiera.
              route = ac.get("route")

              if isinstance(route, dict):
                  nested_pairs = [
                      ("origin_iata", "destination_iata"),
                      ("from_iata", "to_iata"),
                      ("origin", "destination"),
                      ("from", "to"),
                      ("src", "dst"),
                  ]

                  for origin_key, dest_key in nested_pairs:
                      origin = clean_iata(route.get(origin_key))
                      destination = clean_iata(route.get(dest_key))

                      if origin or destination:
                          return origin, destination

              # 3. Texto de ruta si existiera.
              if isinstance(route, str):
                  origin, destination = route_from_text(route)
                  if origin or destination:
                      return origin, destination

              # 4. Otros campos textuales posibles.
              for key in ["routeLabel", "route_label", "route_text", "flight_route"]:
                  origin, destination = route_from_text(ac.get(key))
                  if origin or destination:
                      return origin, destination

              return "", ""

          def fetch_json(url, headers=None, timeout=45):
              req = urllib.request.Request(url, headers=headers or {})

              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  raw_bytes = resp.read()
                  encoding = resp.headers.get("Content-Encoding", "")

              if "gzip" in encoding.lower():
                  raw_bytes = gzip.decompress(raw_bytes)

              return json.loads(raw_bytes.decode("utf-8"))

          def feature_key(feature):
              props = feature.get("properties") or {}
              coords = feature.get("geometry", {}).get("coordinates") or []

              icao24 = clean_text(props.get("icao24")).lower()
              if icao24:
                  return f"icao24:{icao24}"

              callsign = clean_text(props.get("callsign")).upper()
              if callsign and len(coords) >= 2:
                  lon = round(float(coords[0]), 2)
                  lat = round(float(coords[1]), 2)
                  return f"callsign:{callsign}:{lon}:{lat}"

              return json.dumps(coords)

          def should_replace_feature(old_feature, new_feature):
              old_props = old_feature.get("properties") or {}
              new_props = new_feature.get("properties") or {}

              # Prioridad: conservar el que trae ruta.
              if new_props.get("route_available") and not old_props.get("route_available"):
                  return True

              if old_props.get("route_available") and not new_props.get("route_available"):
                  return False

              # Si ambos son comparables, preferir el visto más recientemente.
              old_seen = old_props.get("seen_seconds")
              new_seen = new_props.get("seen_seconds")

              try:
                  if old_seen is not None and new_seen is not None:
                      return float(new_seen) < float(old_seen)
              except Exception:
                  pass

              return False

          def build_adsb_feature(ac, source_label):
              lat = first_present(ac, ["lat", "latitude"])
              lon = first_present(ac, ["lon", "lng", "longitude"])

              if lat is None or lon is None:
                  return None

              if not in_bbox(lat, lon):
                  return None

              alt_baro = first_present(ac, ["alt_baro", "altitude", "alt"])
              gs = first_present(ac, ["gs", "ground_speed", "speed"])

              on_ground = (
                  (isinstance(alt_baro, str) and alt_baro.lower() == "ground") or
                  ac.get("ground") is True or
                  ac.get("on_ground") is True
              )

              if on_ground:
                  return None

              origin_iata, destination_iata = extract_route(ac)
              route_label = build_route_label(origin_iata, destination_iata)

              icao24 = clean_text(first_present(ac, ["hex", "icao24"])).lower()
              callsign = clean_text(first_present(ac, ["flight", "callsign", "call"]))

              return {
                  "type": "Feature",
                  "geometry": {
                      "type": "Point",
                      "coordinates": [float(lon), float(lat)]
                  },
                  "properties": {
                      "icao24": icao24,
                      "callsign": callsign,
                      "registration": clean_text(first_present(ac, ["r", "registration", "reg"])),
                      "aircraft_type": clean_text(first_present(ac, ["t", "aircraft_type", "type_desc"])),
                      "origin_country": clean_text(first_present(ac, ["origin_country", "country"])) or None,

                      "origin_iata": origin_iata or None,
                      "destination_iata": destination_iata or None,
                      "route_label": route_label,
                      "route_available": bool(route_label),
                      "route_source": source_label if route_label else None,

                      "baro_altitude_ft": alt_baro,
                      "baro_altitude_m": feet_to_meters(alt_baro),
                      "geo_altitude_ft": first_present(ac, ["alt_geom", "geo_altitude_ft"]),
                      "geo_altitude_m": feet_to_meters(first_present(ac, ["alt_geom", "geo_altitude_ft"])),
                      "velocity_kt": gs,
                      "velocity_ms": None,
                      "velocity_kmh": knots_to_kmh(gs),
                      "true_track": first_present(ac, ["track", "true_track", "trk"]),
                      "vertical_rate_fpm": first_present(ac, ["baro_rate", "vertical_rate_fpm"]),
                      "vertical_rate_ms": None,

                      "squawk": clean_text(ac.get("squawk")),
                      "emergency": clean_text(ac.get("emergency")),
                      "category": clean_text(ac.get("category")),
                      "source_type": source_label,
                      "seen_seconds": ac.get("seen"),
                      "seen_position_seconds": ac.get("seen_pos"),
                      "on_ground": False
                  }
              }

          def fetch_point_source(source):
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; geodata-aircraft-updater/1.0)",
                  "Accept-Encoding": "gzip",
              }

              features_by_key = {}
              point_errors = []
              points_ok = 0

              for point in QUERY_POINTS:
                  url = source["url_template"].format(
                      lat=point["lat"],
                      lon=point["lon"],
                      radius=RADIUS_NM
                  )

                  try:
                      raw = fetch_json(url, headers=headers, timeout=45)
                      aircraft = raw.get("ac") or raw.get("aircraft") or []
                      points_ok += 1

                      for ac in aircraft:
                          feature = build_adsb_feature(ac, source["label"])
                          if not feature:
                              continue

                          key = feature_key(feature)
                          old_feature = features_by_key.get(key)

                          if not old_feature or should_replace_feature(old_feature, feature):
                              features_by_key[key] = feature

                  except Exception as e:
                      point_errors.append({
                          "point": point["id"],
                          "error": str(e)
                      })

                  time.sleep(source["pause_seconds"])

              if points_ok == 0:
                  raise RuntimeError(f"No respondió ningún punto de {source['label']}: {point_errors}")

              features = list(features_by_key.values())
              total_with_route = sum(
                  1 for feature in features
                  if feature.get("properties", {}).get("route_available")
              )

              return {
                  "source": source["label"],
                  "features": features,
                  "total_with_route": total_with_route,
                  "route_note": "Las rutas dependen de la disponibilidad de campos de origen/destino en la fuente. Cuando no existan, route_available queda en false.",
                  "fallback_used": False,
                  "point_errors": point_errors,
                  "points_ok": points_ok
              }

          def safe_get(row, index, default=None):
              try:
                  return row[index]
              except Exception:
                  return default

          def build_opensky_feature(row):
              icao24 = safe_get(row, 0)
              callsign = safe_get(row, 1)
              origin_country = safe_get(row, 2)
              time_position = safe_get(row, 3)
              last_contact = safe_get(row, 4)
              lon = safe_get(row, 5)
              lat = safe_get(row, 6)
              baro_altitude = safe_get(row, 7)
              on_ground = safe_get(row, 8)
              velocity = safe_get(row, 9)
              true_track = safe_get(row, 10)
              vertical_rate = safe_get(row, 11)
              geo_altitude = safe_get(row, 13)
              squawk = safe_get(row, 14)
              spi = safe_get(row, 15)
              position_source = safe_get(row, 16)
              category = safe_get(row, 17)

              if lat is None or lon is None:
                  return None

              if on_ground is True:
                  return None

              return {
                  "type": "Feature",
                  "geometry": {
                      "type": "Point",
                      "coordinates": [lon, lat]
                  },
                  "properties": {
                      "icao24": clean_text(icao24).lower(),
                      "callsign": clean_text(callsign),
                      "registration": None,
                      "aircraft_type": None,
                      "origin_country": origin_country,

                      "origin_iata": None,
                      "destination_iata": None,
                      "route_label": None,
                      "route_available": False,
                      "route_source": None,

                      "time_position": time_position,
                      "last_contact": last_contact,
                      "baro_altitude_m": baro_altitude,
                      "baro_altitude_ft": meters_to_feet(baro_altitude),
                      "geo_altitude_m": geo_altitude,
                      "geo_altitude_ft": meters_to_feet(geo_altitude),
                      "velocity_ms": velocity,
                      "velocity_kt": None,
                      "velocity_kmh": ms_to_kmh(velocity),
                      "true_track": true_track,
                      "vertical_rate_ms": vertical_rate,
                      "vertical_rate_fpm": None,

                      "squawk": squawk,
                      "spi": spi,
                      "position_source": position_source,
                      "category": category,
                      "source_type": "OpenSky",
                      "on_ground": on_ground
                  }
              }

          def try_opensky(previous_errors=None):
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; geodata-aircraft-updater/1.0)"
              }

              raw = fetch_json(OPENSKY_URL, headers=headers, timeout=30)
              states = raw.get("states") or []

              features = []

              for row in states:
                  feature = build_opensky_feature(row)
                  if feature:
                      features.append(feature)

              return {
                  "source": "OpenSky Network /states/all",
                  "features": features,
                  "total_with_route": 0,
                  "route_note": "La fuente OpenSky no informa origen/destino en tiempo real. Los campos de ruta quedan previstos para una fuente complementaria.",
                  "fallback_used": True,
                  "point_errors": [],
                  "points_ok": 1,
                  "previous_errors": previous_errors or []
              }

          def choose_best_result(results):
              if not results:
                  return None

              # Prioridad: más rutas disponibles; luego más aeronaves.
              return sorted(
                  results,
                  key=lambda item: (
                      item.get("total_with_route", 0),
                      len(item.get("features", []))
                  ),
                  reverse=True
              )[0]

          try:
              source_results = []
              source_errors = []

              for source in SOURCES:
                  try:
                      print(f"Consultando {source['label']}...")
                      result = fetch_point_source(source)

                      print(
                          f"{source['label']}: "
                          f"{len(result['features'])} aeronaves, "
                          f"{result['total_with_route']} con ruta, "
                          f"{result['points_ok']} puntos OK."
                      )

                      if result["features"]:
                          source_results.append(result)
                      else:
                          source_errors.append({
                              "source": source["label"],
                              "error": "La fuente respondió, pero no devolvió aeronaves dentro del área."
                          })

                  except Exception as e:
                      print(f"{source['label']} falló: {e}")
                      source_errors.append({
                          "source": source["label"],
                          "error": str(e)
                      })

              selected = choose_best_result(source_results)

              if not selected:
                  print("No hubo resultados útiles en ADSB.lol ni Airplanes.live. Se intenta OpenSky.")
                  selected = try_opensky(previous_errors=source_errors)

              geojson = {
                  "type": "FeatureCollection",
                  "name": "aviones_en_vuelo_argentina",
                  "updated_utc": utc_now(),
                  "source": selected["source"],
                  "bbox_query": BBOX,
                  "query_radius_nm": RADIUS_NM,
                  "query_points": QUERY_POINTS,
                  "total_features": len(selected["features"]),
                  "total_with_route": selected["total_with_route"],
                  "route_note": selected["route_note"],
                  "fallback_used": selected.get("fallback_used", False),
                  "source_errors": source_errors,
                  "point_errors": selected.get("point_errors", []),
                  "features": selected["features"]
              }

              output_path.write_text(
                  json.dumps(geojson, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8"
              )

              print(f"OK, escrito {output_path}")
              print(f"Fuente usada: {geojson['source']}")
              print(f"Aeronaves en vuelo dentro del área: {geojson['total_features']}")
              print(f"Aeronaves con origen/destino disponible: {geojson['total_with_route']}")

          except Exception as e:
              print(f"Error general descargando aviones en vuelo: {e}")

              if output_path.exists():
                  previous = json.loads(output_path.read_text(encoding="utf-8"))
                  previous["last_error"] = str(e)
                  previous["last_error_utc"] = utc_now()

                  output_path.write_text(
                      json.dumps(previous, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8"
                  )

                  print("Se conservó el archivo anterior con marca de error.")

              else:
                  empty = {
                      "type": "FeatureCollection",
                      "name": "aviones_en_vuelo_argentina",
                      "updated_utc": utc_now(),
                      "source": "sin_datos",
                      "bbox_query": BBOX,
                      "query_radius_nm": RADIUS_NM,
                      "query_points": QUERY_POINTS,
                      "total_features": 0,
                      "total_with_route": 0,
                      "route_note": "No se pudo obtener información de aeronaves.",
                      "last_error": str(e),
                      "last_error_utc": utc_now(),
                      "features": []
                  }

                  output_path.write_text(
                      json.dumps(empty, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8"
                  )

                  print("Se escribió archivo vacío con marca de error.")
          EOF

      - name: Commit y push si cambió algo
        run: |
          git config user.name "aircraft-bot"
          git config user.email "aircraft-bot@users.noreply.github.com"
          git add data/aircraft/latest.geojson
          git diff --staged --quiet || git commit -m "Actualiza aviones en vuelo $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
