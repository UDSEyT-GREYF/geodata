name: Actualizar aviones en vuelo

on:
  schedule:
    # cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar aviones en vuelo desde OpenSky
        run: |
          mkdir -p data/aircraft

          python3 - <<'EOF'
          import json
          import urllib.parse
          import urllib.request
          import datetime
          from pathlib import Path

          # Bounding box aproximado Argentina + entorno inmediato.
          # OpenSky usa WGS84:
          # lamin = latitud mínima
          # lomin = longitud mínima
          # lamax = latitud máxima
          # lomax = longitud máxima
          bbox = {
              "lamin": -56.5,
              "lomin": -76.5,
              "lamax": -20.0,
              "lomax": -50.0,
          }

          base_url = "https://opensky-network.org/api/states/all"
          url = base_url + "?" + urllib.parse.urlencode(bbox)

          output_path = Path("data/aircraft/latest.geojson")
          fallback_path = output_path

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; geodata-aircraft-updater/1.0)"
          }

          def meters_to_feet(value):
              if value is None:
                  return None
              try:
                  return round(float(value) * 3.28084)
              except Exception:
                  return None

          def ms_to_kmh(value):
              if value is None:
                  return None
              try:
                  return round(float(value) * 3.6, 1)
              except Exception:
                  return None

          def safe_get(row, index, default=None):
              try:
                  return row[index]
              except Exception:
                  return default

          def build_feature(row):
              icao24 = safe_get(row, 0)
              callsign = safe_get(row, 1)
              origin_country = safe_get(row, 2)
              time_position = safe_get(row, 3)
              last_contact = safe_get(row, 4)
              lon = safe_get(row, 5)
              lat = safe_get(row, 6)
              baro_altitude = safe_get(row, 7)
              on_ground = safe_get(row, 8)
              velocity = safe_get(row, 9)
              true_track = safe_get(row, 10)
              vertical_rate = safe_get(row, 11)
              geo_altitude = safe_get(row, 13)
              squawk = safe_get(row, 14)
              spi = safe_get(row, 15)
              position_source = safe_get(row, 16)
              category = safe_get(row, 17)

              if lat is None or lon is None:
                  return None

              # Para “aviones en vuelo” excluimos aeronaves en tierra.
              if on_ground is True:
                  return None

              return {
                  "type": "Feature",
                  "geometry": {
                      "type": "Point",
                      "coordinates": [lon, lat]
                  },
                  "properties": {
                      "icao24": icao24,
                      "callsign": (callsign or "").strip(),
                      "origin_country": origin_country,
                      "time_position": time_position,
                      "last_contact": last_contact,
                      "baro_altitude_m": baro_altitude,
                      "baro_altitude_ft": meters_to_feet(baro_altitude),
                      "geo_altitude_m": geo_altitude,
                      "geo_altitude_ft": meters_to_feet(geo_altitude),
                      "velocity_ms": velocity,
                      "velocity_kmh": ms_to_kmh(velocity),
                      "true_track": true_track,
                      "vertical_rate_ms": vertical_rate,
                      "squawk": squawk,
                      "spi": spi,
                      "position_source": position_source,
                      "category": category,
                      "on_ground": on_ground
                  }
              }

          try:
              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = json.loads(resp.read().decode("utf-8"))

              states = raw.get("states") or []

              features = []
              for row in states:
                  feature = build_feature(row)
                  if feature:
                      features.append(feature)

              geojson = {
                  "type": "FeatureCollection",
                  "name": "aviones_en_vuelo_argentina",
                  "updated_utc": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
                  "source": "OpenSky Network /states/all",
                  "bbox_query": bbox,
                  "total_features": len(features),
                  "features": features
              }

              output_path.write_text(
                  json.dumps(geojson, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8"
              )

              print(f"OK, escrito {output_path} con {len(features)} aeronaves.")

          except Exception as e:
              print(f"Error descargando OpenSky: {e}")

              # Si falla la descarga, mantiene el archivo anterior y marca error.
              if fallback_path.exists():
                  previous = json.loads(fallback_path.read_text(encoding="utf-8"))
                  previous["last_error"] = str(e)
                  previous["last_error_utc"] = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"
                  fallback_path.write_text(
                      json.dumps(previous, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8"
                  )
                  print("Se conservó el archivo anterior con marca de error.")
              else:
                  empty = {
                      "type": "FeatureCollection",
                      "name": "aviones_en_vuelo_argentina",
                      "updated_utc": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
                      "source": "OpenSky Network /states/all",
                      "bbox_query": bbox,
                      "total_features": 0,
                      "last_error": str(e),
                      "features": []
                  }
                  output_path.write_text(
                      json.dumps(empty, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8"
                  )
                  print("Se escribió archivo vacío con marca de error.")
          EOF

      - name: Commit y push si cambió algo
        run: |
          git config user.name "aircraft-bot"
          git config user.email "aircraft-bot@users.noreply.github.com"
          git add data/aircraft/latest.geojson
          git diff --staged --quiet || git commit -m "Actualiza aviones en vuelo $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
