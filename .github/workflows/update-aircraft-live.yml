name: Actualizar aviones en vuelo

on:
  schedule:
    # cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar aviones en vuelo con origen y destino
        env:
          ADSBIQ_TOKEN: ${{ secrets.ADSBIQ_TOKEN }}
        run: |
          mkdir -p data/aircraft

          python3 - <<'EOF'
          import json
          import urllib.request
          import datetime
          import gzip
          import os
          from pathlib import Path

          # Fuente ADS-B con campos de ruta:
          # route_origin = aeropuerto de origen IATA
          # route_dest   = aeropuerto de destino IATA
          ADSB_URL = "https://api.adsbiq.com/v2/all"

          output_path = Path("data/aircraft/latest.geojson")

          # Bounding box aproximado Argentina + entorno regional
          BBOX = {
              "lat_min": -56.5,
              "lon_min": -76.5,
              "lat_max": -20.0,
              "lon_max": -50.0,
          }

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; geodata-aircraft-updater/1.0)",
              "Accept-Encoding": "gzip",
          }

          token = os.environ.get("ADSBIQ_TOKEN", "").strip()
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def clean_text(value):
              return str(value or "").strip()

          def clean_iata(value):
              text = clean_text(value).upper()
              if len(text) == 3 and text.isalnum():
                  return text
              return ""

          def in_bbox(lat, lon):
              try:
                  lat = float(lat)
                  lon = float(lon)
              except Exception:
                  return False

              return (
                  BBOX["lat_min"] <= lat <= BBOX["lat_max"] and
                  BBOX["lon_min"] <= lon <= BBOX["lon_max"]
              )

          def feet_to_meters(value):
              if value is None:
                  return None

              if isinstance(value, str) and value.lower() == "ground":
                  return 0

              try:
                  return round(float(value) * 0.3048, 1)
              except Exception:
                  return None

          def knots_to_kmh(value):
              if value is None:
                  return None

              try:
                  return round(float(value) * 1.852, 1)
              except Exception:
                  return None

          def build_route_label(origin, destination):
              if origin and destination:
                  return f"{origin} → {destination}"
              if origin:
                  return f"{origin} → s/d"
              if destination:
                  return f"s/d → {destination}"
              return ""

          def build_feature(ac):
              lat = ac.get("lat")
              lon = ac.get("lon")

              if lat is None or lon is None:
                  return None

              if not in_bbox(lat, lon):
                  return None

              alt_baro = ac.get("alt_baro")
              gs = ac.get("gs")

              # Excluimos aeronaves en tierra para este mapa
              if isinstance(alt_baro, str) and alt_baro.lower() == "ground":
                  return None

              origin_iata = clean_iata(ac.get("route_origin"))
              destination_iata = clean_iata(ac.get("route_dest"))
              route_label = build_route_label(origin_iata, destination_iata)

              return {
                  "type": "Feature",
                  "geometry": {
                      "type": "Point",
                      "coordinates": [float(lon), float(lat)]
                  },
                  "properties": {
                      "icao24": clean_text(ac.get("hex")).lower(),
                      "callsign": clean_text(ac.get("flight")),
                      "registration": clean_text(ac.get("r")),
                      "aircraft_type": clean_text(ac.get("t")),
                      "category": clean_text(ac.get("category")),
                      "source_type": clean_text(ac.get("type")),

                      "origin_iata": origin_iata or None,
                      "destination_iata": destination_iata or None,
                      "route_label": route_label or None,
                      "route_available": bool(origin_iata or destination_iata),
                      "route_source": "ADSBiq route_origin/route_dest" if route_label else None,

                      "baro_altitude_ft": alt_baro,
                      "baro_altitude_m": feet_to_meters(alt_baro),
                      "geo_altitude_ft": ac.get("alt_geom"),
                      "geo_altitude_m": feet_to_meters(ac.get("alt_geom")),
                      "velocity_kt": gs,
                      "velocity_kmh": knots_to_kmh(gs),
                      "true_track": ac.get("track"),
                      "vertical_rate_fpm": ac.get("baro_rate"),

                      "squawk": clean_text(ac.get("squawk")),
                      "emergency": clean_text(ac.get("emergency")),
                      "seen_seconds": ac.get("seen"),
                      "seen_position_seconds": ac.get("seen_pos")
                  }
              }

          try:
              req = urllib.request.Request(ADSB_URL, headers=headers)

              with urllib.request.urlopen(req, timeout=45) as resp:
                  raw_bytes = resp.read()
                  encoding = resp.headers.get("Content-Encoding", "")

              if "gzip" in encoding.lower():
                  raw_bytes = gzip.decompress(raw_bytes)

              raw = json.loads(raw_bytes.decode("utf-8"))
              aircraft = raw.get("ac") or []

              features = []
              total_with_route = 0

              for ac in aircraft:
                  feature = build_feature(ac)
                  if not feature:
                      continue

                  if feature["properties"].get("route_available"):
                      total_with_route += 1

                  features.append(feature)

              geojson = {
                  "type": "FeatureCollection",
                  "name": "aviones_en_vuelo_argentina",
                  "updated_utc": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
                  "source": "ADSBiq /v2/all",
                  "bbox_query": BBOX,
                  "total_features": len(features),
                  "total_with_route": total_with_route,
                  "route_note": "Los campos origin_iata y destination_iata dependen de la disponibilidad de route_origin y route_dest en la fuente. Pueden venir vacíos.",
                  "features": features
              }

              output_path.write_text(
                  json.dumps(geojson, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8"
              )

              print(f"OK, escrito {output_path}")
              print(f"Aeronaves en vuelo dentro del bbox: {len(features)}")
              print(f"Aeronaves con origen/destino disponible: {total_with_route}")

          except Exception as e:
              print(f"Error descargando ADSBiq: {e}")

              if output_path.exists():
                  previous = json.loads(output_path.read_text(encoding="utf-8"))
                  previous["last_error"] = str(e)
                  previous["last_error_utc"] = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"
                  output_path.write_text(
                      json.dumps(previous, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8"
                  )
                  print("Se conservó el archivo anterior con marca de error.")
              else:
                  empty = {
                      "type": "FeatureCollection",
                      "name": "aviones_en_vuelo_argentina",
                      "updated_utc": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
                      "source": "ADSBiq /v2/all",
                      "bbox_query": BBOX,
                      "total_features": 0,
                      "total_with_route": 0,
                      "last_error": str(e),
                      "features": []
                  }

                  output_path.write_text(
                      json.dumps(empty, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8"
                  )
                  print("Se escribió archivo vacío con marca de error.")
          EOF

      - name: Commit y push si cambió algo
        run: |
          git config user.name "aircraft-bot"
          git config user.email "aircraft-bot@users.noreply.github.com"
          git add data/aircraft/latest.geojson
          git diff --staged --quiet || git commit -m "Actualiza aviones en vuelo $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
