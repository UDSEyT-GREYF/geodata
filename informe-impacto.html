<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe de impacto por aeropuerto – ORSNA</title>

  <link rel="icon" type="image/png" href="img/icons/iconoIET.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/datos-clave-lamina.css?v=impacto3">
  <link rel="stylesheet" href="css/informe-impacto.css?v=impacto3">
  <link rel="stylesheet" href="css/portada-informe.css?v=impacto3">
  <link rel="stylesheet" href="css/resumen-ejecutivo.css?v=impacto6">
  <link rel="stylesheet" href="css/oferta-demanda.css?v=impacto1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="page-informe-impacto">
  <header class="report-toolbar">
    <div class="toolbar-actions">
<label class="toolbar-label" for="airportSearchInput">Aeropuerto</label>

<div class="airport-search" id="airportSearch">
  <div class="airport-search-control">
    <input
      id="airportSearchInput"
      class="airport-search-input"
      type="text"
      autocomplete="off"
      spellcheck="false"
      role="combobox"
      aria-autocomplete="list"
      aria-expanded="false"
      aria-controls="airportSearchResults"
      placeholder="Buscar aeropuerto o código IATA"
    >
    <button
      id="airportSearchClear"
      class="airport-search-clear"
      type="button"
      aria-label="Limpiar búsqueda"
      title="Limpiar búsqueda"
    >×</button>
  </div>

  <div
    id="airportSearchResults"
    class="airport-search-results"
    role="listbox"
    aria-label="Resultados de búsqueda de aeropuertos"
  ></div>
</div>

<select id="airportSelect" class="toolbar-select toolbar-select-hidden" aria-hidden="true" tabindex="-1">
  <option value="">Cargando aeropuertos...</option>
</select>

<button id="btnExportReportPng" class="toolbar-btn" type="button">Exportar PDF A4</button>
    </div>
  </header>

  <main class="sheet-wrap">
    <div id="reportStack" class="report-stack">
      <div id="coverMount"></div>
      <div id="summaryMount"></div>
      <div id="laminaMount"></div>
      <div id="offerDemandMount"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="js/portada-informe.js?v=impacto3"></script>
  <script src="js/datos-clave-lamina.js?v=impacto3"></script>
  <script src="js/informe-impacto.js?v=impacto4"></script>
  <script src="js/resumen-ejecutivo.js?v=impacto6"></script>
  <script src="js/oferta-demanda.js?v=impacto1"></script>
</body>
</html>
