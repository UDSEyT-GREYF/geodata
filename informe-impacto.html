<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe de impacto por aeropuerto – ORSNA</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/datos-clave-lamina.css?v=impacto3">
  <link rel="stylesheet" href="css/informe-impacto.css?v=impacto3">
  <link rel="stylesheet" href="css/portada-informe.css?v=impacto3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="lamina-toolbar no-print">
    <div class="toolbar-left">
      <div class="toolbar-title">Informe de impacto por aeropuerto</div>
      <div class="toolbar-subtitle">Portada + lámina de datos clave</div>
    </div>

    <div class="toolbar-actions">
      <label class="toolbar-label" for="airportSelect">Aeropuerto</label>
      <select id="airportSelect" class="toolbar-select">
        <option value="">Cargando aeropuertos...</option>
      </select>

      <button id="btnExportReportPng" class="toolbar-btn" type="button">Exportar PNG</button>
      <button id="btnPrintReport" class="toolbar-btn" type="button">Imprimir</button>
    </div>
  </div>

  <main class="sheet-wrap">
    <div id="reportStack" class="report-stack">
      <div id="coverMount"></div>
      <div id="laminaMount"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script src="js/portada-informe.js?v=impacto3"></script>
  <script src="js/datos-clave-lamina.js?v=impacto3"></script>
  <script src="js/informe-impacto.js?v=impacto4"></script>
</body>
</html>
