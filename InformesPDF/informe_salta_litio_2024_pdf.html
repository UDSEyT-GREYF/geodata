<!DOCTYPE html>

<head>

  <style>
    body {

      display:flex;

    header {
      background:#004b80;
      color:#fff;

      background:#0066b3;
      color:#fff;
      text-decoration:none;
      font-weight:600;
      font-size:0.9rem;

    .btn-link:hover {

      font-size:0.8rem;
      color:#666;
