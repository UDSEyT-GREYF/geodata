<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Área de influencia aeroportuaria – GeoData ORSNA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- CSS propio -->
  <link rel="stylesheet" href="css/mapa_influencia.css">
</head>
<body>

  <header>
    <div>
      <h1 id="mapTitle">Área de influencia aeroportuaria</h1>
      <p id="mapSubtitle" class="subtitle">
        Anillos de tiempo de viaje por carretera y área de influencia aeroportuaria.
      </p>
    </div>
    <a href="datos-clave.html" class="back-link">← Volver a Datos clave</a>
  </header>

  <div id="map">
    <div class="legend">
      <div class="legend-title">Tiempos de viaje</div>
      <div class="legend-item">
        <span class="legend-color t1"></span>
        <span>Hasta 1 h</span>
      </div>
      <div class="legend-item">
        <span class="legend-color t2"></span>
        <span>Entre 1 y 2 h</span>
      </div>
      <div class="legend-item">
        <span class="legend-color t3"></span>
        <span>Entre 2 y 3 h</span>
      </div>
      <div class="legend-item" style="margin-top:4px;">
        <span class="legend-color ai"></span>
        <span>Área de influencia aeroportuaria</span>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <!-- JS propio -->
  <script src="js/mapa_influencia.js"></script>

</body>
</html>
