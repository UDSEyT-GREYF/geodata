<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Área de influencia aeroportuaria – GeoData ORSNA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1224;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 8px 14px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #f9fafb;
    }

    header p {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    .subtitle {
      font-size: 0.78rem;
      color: #9ca3af;
    }

    .back-link {
      font-size: 0.8rem;
      color: #93c5fd;
      text-decoration: none;
      white-space: nowrap;
    }
    .back-link:hover { text-decoration: underline; }

    #map {
      flex: 1;
      width: 100%;
      height: calc(100vh - 50px);
    }

    /* Leyenda */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      color: #e5e7eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .legend-title {
      font-weight: 600;
      margin-bottom: 4px;
      color: #bfdbfe;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid #000;
      flex-shrink: 0;
    }

    .legend-color.t1 { background-color: #08306b; }
    .legend-color.t2 { background-color: #2171b5; }
    .legend-color.t3 { background-color: #6baed6; }
    .legend-color.ai {
      background-color: rgba(191, 219, 254, 0.6);
      border-color: #1d4ed8;
    }

    /* Tooltip estilo PSN para etiqueta IATA */
    .psn-tooltip {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #333;
      border-radius: 2px;
      padding: 2px 2px;
      font-size: 0.6rem;
      color: #111;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 id="mapTitle">Área de influencia aeroportuaria</h1>
      <p id="mapSubtitle" class="subtitle">
        Anillos de tiempo de viaje por carretera y área de influencia aeroportuaria.
      </p>
    </div>
    <a href="datos-clave.html" class="back-link">← Volver a Datos clave</a>
  </header>

  <div id="map"></div>

  <div class="legend">
    <div class="legend-title">Tiempos de viaje</div>
    <div class="legend-item">
      <span class="legend-color t1"></span>
      <span>Hasta 1 h</span>
    </div>
    <div class="legend-item">
      <span class="legend-color t2"></span>
      <span>Entre 1 y 2 h</span>
    </div>
    <div class="legend-item">
      <span class="legend-color t3"></span>
      <span>Entre 2 y 3 h</span>
    </div>
    <div class="legend-item" style="margin-top:4px;">
      <span class="legend-color ai"></span>
      <span>Área de influencia aeroportuaria</span>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <script>
    /* =============================
       VARIABLES GLOBALES
       ============================= */
    let mapInfluencia;
    let tiemposLayer = null;
    let influenciaLayer = null;
    let influenciaMarker = null;

    let aeropuertos = [];           // props de Datos_aeropuertos.geojson
    let aeropuertosPoligonos = [];  // polígonos de poligonos_aeropuertos.geojson
    let areasInfluenciaFeatures = []; // polígonos de Areasinfluencia39.geojson

    const urlParams = new URLSearchParams(window.location.search);
    const IATA_PARAM = (urlParams.get("airport") || "").toUpperCase();

    // Icono de aeropuerto (igual que en datos-clave)
    const airportIcon = L.icon({
      iconUrl: "img/icons/AeropuertosSNA.png",
      iconSize: [32, 32],
      iconAnchor: [16, 16],
      tooltipAnchor: [0, -18]
    });

    function clean(text) {
      if (text === null || text === undefined) return "";
      return String(text).trim();
    }

    /* =============================
       MAPA BASE
       ============================= */
    function initMapInfluencia() {
      mapInfluencia = L.map("map").setView([-38, -64], 4);

      // Base IGN Argenmap, como en datos-clave
      L.tileLayer(
        "https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capabaseargenmap@EPSG:3857@png/{z}/{x}/{-y}.png",
        {
          maxZoom: 14,
          tms: true,
          attribution: "© IGN Argentina - Argenmap"
        }
      ).addTo(mapInfluencia);
    }

    /* =============================
       CENTRO DEL AEROPUERTO
       (mismo criterio que en datos-clave)
       ============================= */
    function getAirportCenterLatLng(a) {
      if (!a) return null;
      const iataCode = a.IATA;

      if (Array.isArray(aeropuertosPoligonos) && aeropuertosPoligonos.length) {
        const feats = aeropuertosPoligonos.filter(f => {
          const p = f.properties || {};
          return String(p.IATA).toUpperCase() === String(iataCode).toUpperCase();
        });

        if (feats.length > 0) {
          const layer = L.geoJSON(feats);
          const bounds = layer.getBounds();
          if (bounds.isValid()) {
            const c = bounds.getCenter();
            return [c.lat, c.lng];
          }
        }
      }

      // Fallback a Lat/Lon del GeoJSON de aeropuertos
      let lat = a["Lat"] || a["LAT"];
      let lon = a["Lon"] || a["LON"] || a["Long"];

      if (lat && lon && !isNaN(Number(lat)) && !isNaN(Number(lon))) {
        return [Number(lat), Number(lon)];
      }

      return null;
    }

    /* =============================
       ACTUALIZAR MAPA PARA UN AEROPUERTO
       (copiado de la lógica del mapa chico)
       ============================= */
    function updateInfluenciaMapForAirport(a) {
      if (!mapInfluencia) return;

      // Limpiar capas previas
      if (tiemposLayer) {
        mapInfluencia.removeLayer(tiemposLayer);
        tiemposLayer = null;
      }
      if (influenciaLayer) {
        mapInfluencia.removeLayer(influenciaLayer);
        influenciaLayer = null;
      }
      if (influenciaMarker) {
        mapInfluencia.removeLayer(influenciaMarker);
        influenciaMarker = null;
      }

      const iataUpper = a.IATA ? String(a.IATA).trim().toUpperCase() : "";
      if (!iataUpper) return;

      /* ----------- 1) Anillos de tiempo (Tiempos_XX.geojson) ----------- */
      const tiemposPath = `img/Tiempos/Tiempos_${iataUpper}.geojson`;

      fetch(tiemposPath)
        .then(resp => {
          if (!resp.ok) return null;
          return resp.json();
        })
        .then(gj => {
          if (!gj || !gj.features || !gj.features.length) {
            ajustarVista(a);
            return;
          }

          tiemposLayer = L.geoJSON(gj, {
            style: (feature) => {
              const props = feature.properties || {};
              const to = Number(props.ToBreak);
              let color;

              if (to === 60) {
                color = "#08306b";      // hasta 1h – más oscuro
              } else if (to === 120) {
                color = "#2171b5";      // 1–2h
              } else if (to === 180) {
                color = "#6baed6";      // 2–3h – más claro
              } else {
                color = "#9ecae1";      // cualquier otro
              }

              return {
                color,
                weight: 1,
                fillColor: color,
                fillOpacity: 0.35      // semitransparente
              };
            }
          }).addTo(mapInfluencia);

          ajustarVista(a);
        })
        .catch(() => {
          console.warn("No se pudo cargar tiempos de viaje:", tiemposPath);
          ajustarVista(a);
        });

      /* ----------- 2) Área de influencia (Areasinfluencia39.geojson) ----------- */
      if (Array.isArray(areasInfluenciaFeatures) && areasInfluenciaFeatures.length) {
        const featsInfl = areasInfluenciaFeatures.filter(f => {
          const props = f.properties || {};
          const code = String(props.IATA || props.iata || "").toUpperCase();
          return code === iataUpper;
        });

        if (featsInfl.length) {
          influenciaLayer = L.geoJSON(featsInfl, {
            style: {
              color: "#1d4ed8",        // azul para borde
              weight: 2,
              fillColor: "#bfdbfe",    // azul claro
              fillOpacity: 0.25
            }
          }).addTo(mapInfluencia);
        }
      }

      /* ----------- 3) Punto del aeropuerto (igual que en mapa chico) ----------- */
      const center = getAirportCenterLatLng(a);
      if (center) {
        influenciaMarker = L.marker(center, { icon: airportIcon }).addTo(mapInfluencia);

        const iataLabel = a["IATA"] ? String(a["IATA"]).toUpperCase() : "";
        if (iataLabel) {
          influenciaMarker.bindTooltip(iataLabel, {
            permanent: true,
            direction: "top",
            offset: [0, -4],
            className: "psn-tooltip"
          });
        }
      }
    }

    /* =============================
       AJUSTAR VISTA
       ============================= */
    function ajustarVista(a) {
      if (!mapInfluencia) return;

      let bounds = null;

      if (tiemposLayer) {
        const b = tiemposLayer.getBounds();
        if (b.isValid()) bounds = b;
      }

      if (influenciaLayer) {
        const b = influenciaLayer.getBounds();
        if (b.isValid()) {
          if (bounds) bounds.extend(b);
          else bounds = b;
        }
      }

      if (influenciaMarker) {
        const m = influenciaMarker.getLatLng();
        const b = L.latLngBounds(m, m);
        if (bounds) bounds.extend(b);
        else bounds = b;
      }

      const fallbackCenter = getAirportCenterLatLng(a) || [-38, -64];

      if (bounds && bounds.isValid()) {
        setTimeout(() => {
          mapInfluencia.invalidateSize();
          mapInfluencia.fitBounds(bounds, { padding: [10, 10] });
        }, 0);
      } else {
        setTimeout(() => {
          mapInfluencia.invalidateSize();
          mapInfluencia.setView(fallbackCenter, 7);
        }, 0);
      }
    }

    /* =============================
       CARGA DE DATOS Y RENDER
       ============================= */
    async function loadDataAndRender() {
      if (!IATA_PARAM) {
        document.getElementById("mapSubtitle").textContent =
          "No se indicó aeropuerto en la URL (?airport=IATA).";
        return;
      }

      try {
        // 1) Datos de aeropuertos (para nombre, año, Lat/Lon, etc.)
        const respAero = await fetch("fuentes/Datos_aeropuertos.geojson");
        const gjAero = await respAero.json();
        aeropuertos = (gjAero.features || []).map(f => f.properties || {});

        // 2) Polígonos de aeropuertos (para centro geométrico)
        try {
          const respPol = await fetch("fuentes/poligonos_aeropuertos.geojson");
          const gjPol = await respPol.json();
          aeropuertosPoligonos = gjPol.features || [];
        } catch (e) {
          console.warn("No se pudieron cargar poligonos_aeropuertos.geojson:", e);
          aeropuertosPoligonos = [];
        }

        // 3) Áreas de influencia (Areasinfluencia39.geojson)
        try {
          const respInf = await fetch("fuentes/Areasinfluencia39.geojson");
          const gjInf = await respInf.json();
          areasInfluenciaFeatures = gjInf.features || [];
        } catch (e) {
          console.warn("No se pudieron cargar Areasinfluencia39.geojson:", e);
          areasInfluenciaFeatures = [];
        }

        // Buscar aeropuerto por IATA
        const a = aeropuertos.find(x => String(x.IATA).toUpperCase() === IATA_PARAM);
        if (!a) {
          document.getElementById("mapSubtitle").textContent =
            `No se encontraron datos para el aeropuerto ${IATA_PARAM}.`;
          return;
        }

        const nombre = clean(a["Aeropuerto"]) || clean(a["Nombre del Aeropuerto"]) || IATA_PARAM;
        const anio = a["Año"] || "";

        document.getElementById("mapTitle").textContent =
          `Área de influencia – ${nombre} (${a.IATA})`;
        document.getElementById("mapSubtitle").textContent =
          `Tiempos de viaje por carretera y área de influencia aeroportuaria · Año ${anio}`;

        updateInfluenciaMapForAirport(a);

      } catch (err) {
        console.error("Error cargando datos:", err);
        document.getElementById("mapSubtitle").textContent =
          "Error al cargar los datos del aeropuerto o del área de influencia.";
      }
    }

    /* =============================
       INICIO
       ============================= */
    document.addEventListener("DOMContentLoaded", () => {
      initMapInfluencia();
      loadDataAndRender();
    });
  </script>
</body>
</html>
